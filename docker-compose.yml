# Every service reads .env, which points the host-side tools (migrate, seed,
# the test suite) at localhost. Inside a container localhost is the container
# itself, so on the compose network each dependency is reached by its name.
x-in-network: &in-network
  POSTGRES_HOST: postgres

services:
  # ── Infrastructure ───────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    # The default max_connections is 100, and ten services opening ~14
    # pools between them ask for more than that before serving a single
    # request. 200 leaves headroom for psql, the migration runner and the
    # test suite alongside a running stack.
    command: postgres -c max_connections=200
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-setu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-setu_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-setu}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-setu}"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2-alpine
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "8222:8222"  # monitoring
    command: ["--jetstream", "--http_port", "8222"]
    healthcheck:
      # Not `nats-server --signal ldm`: ldm is lame-duck mode, which tells the
      # server to shut down, so that check stopped NATS five seconds after boot.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Services ─────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: deploy/docker/gateway.Dockerfile
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    env_file: .env
    # Without these the gateway falls back to 127.0.0.1, which inside
    # its own container is the gateway — so it could reach no service at
    # all. On the compose network each service answers to its own name.
    environment:
      <<: *in-network
      AUTH_SERVICE_URL: http://auth:3001
      DATA_SERVICE_URL: http://data:3002
      STORAGE_SERVICE_URL: http://storage:3003
      FUNCTIONS_SERVICE_URL: http://functions:3004
      CONSENT_SERVICE_URL: http://consent:3005
      AUDIT_SERVICE_URL: http://audit:3006
      WORKFLOW_SERVICE_URL: http://workflow:3007
      METERING_SERVICE_URL: http://metering:3008
      AI_SERVICE_URL: http://ai:3009

  # ── Platform services ────────────────────────────────────
  #
  # None of these publish a port. The gateway is the only way in, and that is
  # load-bearing rather than tidy: these services trust the x-setu-* context
  # headers the gateway signs, so anyone able to reach one directly could name
  # their own purpose and the database would evaluate consent for whatever was
  # claimed. They remain reachable from each other over the compose network.
  auth:
    build:
      context: .
      dockerfile: deploy/docker/auth.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      <<: *in-network

  data:
    build:
      context: .
      dockerfile: deploy/docker/data.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    env_file: .env
    environment:
      <<: *in-network

  storage:
    build:
      context: .
      dockerfile: deploy/docker/storage.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      <<: *in-network

  functions:
    build:
      context: .
      dockerfile: deploy/docker/functions.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    # No docker.sock mount. The runtime executes tenant JavaScript in a child
    # process with no syscall isolation (services/functions/src/runtime.ts), so
    # handing it the host Docker daemon would turn any deployed function into
    # root on the host. Nothing spawns containers today; when real isolation
    # arrives it will be gVisor or Firecracker, not the host socket.
    env_file: .env
    environment:
      <<: *in-network

  consent:
    build:
      context: .
      dockerfile: deploy/docker/consent.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    env_file: .env
    environment:
      <<: *in-network

  audit:
    build:
      context: .
      dockerfile: deploy/docker/audit.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    env_file: .env
    environment:
      <<: *in-network

  workflow:
    build:
      context: .
      dockerfile: deploy/docker/workflow.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    env_file: .env
    environment:
      <<: *in-network
      FUNCTIONS_SERVICE_URL: http://functions:3004

  ai:
    build:
      context: .
      dockerfile: deploy/docker/ai.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      <<: *in-network

  metering:
    build:
      context: .
      dockerfile: deploy/docker/metering.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    env_file: .env
    environment:
      <<: *in-network

volumes:
  pgdata:
