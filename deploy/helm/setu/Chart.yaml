apiVersion: v2
name: setu
description: Setu — DPDP-Compliant BaaS Platform
type: application
version: 0.1.0
appVersion: "0.1.0"

dependencies:
  - name: postgresql
    version: "~15.0"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: minio
    version: "~14.0"
    repository: https://charts.bitnami.com/bitnami
    condition: minio.enabled
  - name: nats
    version: "~1.0"
    repository: https://nats-io.github.io/k8s/helm/charts/
    condition: nats.enabled
