name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: setu
          POSTGRES_PASSWORD: setu_test
          POSTGRES_DB: setu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: setu
      POSTGRES_PASSWORD: setu_test
      POSTGRES_DB: setu_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    strategy:
      matrix:
        service:
          - gateway
          - auth
          - data
          - storage
          - functions
          - consent
          - audit
          - workflow
          - metering
          - ai

    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.service }} image
        run: |
          docker build \
            -f deploy/docker/${{ matrix.service }}.Dockerfile \
            -t setu/${{ matrix.service }}:${{ github.sha }} \
            -t setu/${{ matrix.service }}:latest \
            .

      # TODO: Push to container registry when GCR/Artifact Registry is set up
      # - name: Push image
      #   run: docker push setu/${{ matrix.service }}:${{ github.sha }}
